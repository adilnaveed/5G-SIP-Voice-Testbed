services:
  kamailio:
    image: ghcr.io/kamailio/kamailio:6.1.3-bookworm
    container_name: kamailio
    volumes:
      - ./kamailio-conf/kamailio.cfg:/etc/kamailio/kamailio.cfg
    ports:
      - "5060:5060/udp"
    networks:
      sipnet:
        ipv4_address: 10.10.0.10
      oai-cn5g-public-net:
        ipv4_address: 192.168.70.160
    depends_on:
      - rtpengine
  rtpengine:
    image: freetechsolutions/rtpengine:latest
    container_name: rtpengine
    privileged: true
    command: >
      rtpengine --interface=192.168.70.161 --listen-ng=0.0.0.0:2223
      --port-min=30000 --port-max=30100 -f --log-stderr
    networks:
      sipnet:
        ipv4_address: 10.10.0.20
      oai-cn5g-public-net:
        ipv4_address: 192.168.70.161
  baresip-ocudu1:
    image: qxip/baresip-docker
    container_name: baresip-ocudu1
    stdin_open: true
    tty: true
    network_mode: "container:oai-ue1"
    depends_on:
      - kamailio
  baresip-ocudu2:
    image: qxip/baresip-docker
    container_name: baresip-ocudu2
    stdin_open: true
    tty: true
    network_mode: "container:oai-ue2"
    depends_on:
      - kamailio
networks:
  sipnet:
    name: sip-stack_sipnet
    external: true
  oai-cn5g-public-net:
    external: true
