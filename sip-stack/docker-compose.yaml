services:
  kamailio:
    image: ghcr.io/kamailio/kamailio:6.1.3-bookworm
    container_name: kamailio
    volumes:
      - ./kamailio-conf/kamailio.cfg:/etc/kamailio/kamailio.cfg
    ports:
      - "5060:5060/udp"
    networks:
      sipnet:
        ipv4_address: 10.10.0.10
    depends_on:
      - rtpengine

  rtpengine:
    image: freetechsolutions/rtpengine:latest
    container_name: rtpengine
    privileged: true
    command: >
      rtpengine --interface=192.168.70.161 --listen-ng=0.0.0.0:2223
      --port-min=30000 --port-max=30100 -f --log-stderr
    networks:
      sipnet:
        ipv4_address: 10.10.0.20

  baresip1:
    image: qxip/baresip-docker
    container_name: baresip1
    stdin_open: true
    tty: true
    network_mode: "container:oai-nr-ue"
#    networks:
#      sipnet:
#        ipv4_address: 10.10.0.101
    depends_on:
      - kamailio

  baresip2:
    image: qxip/baresip-docker
    container_name: baresip2
    stdin_open: true
    tty: true
    network_mode: "container:oai-nr-ue2"
#    networks:
#      sipnet:
#        ipv4_address: 10.10.0.102
    depends_on:
      - kamailio

networks:
  sipnet:
    driver: bridge
    ipam:
      config:
        - subnet: 10.10.0.0/24
